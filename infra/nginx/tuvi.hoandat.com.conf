# .65: /etc/nginx/conf.d/tuvi.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here -> the static web app
# from the current release, and /api/, /auth/, /healthz to the Node server on loopback :5290 of this host.
# The Cloudflare real-IP restore is global on this host, so $remote_addr is the visitor's IP; the server
# trusts X-Forwarded-For from loopback only.

server {
    listen 80;
    listen [::]:80;
    server_name tuvi.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuvi.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/tuvi.hoandat.com.access.log;
    error_log  /var/log/nginx/tuvi.hoandat.com.error.log;

    root /var/www/tuvi/current/apps/web/dist;
    # Saved charts are a few hundred bytes of JSON.
    client_max_body_size 16k;

    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5290;
        proxy_set_header Host $host;
    }

    # Every non-API response carries these. The nested location adds no header of its own (nginx would drop
    # the inherited ones), and the API stays out: the server (helmet) sends its own.
    # Cloudflare Web Analytics is allowed in script-src/connect-src (the privacy page says so).
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri /index.html;

        # Hashed build files: cached for a year; a miss is a real 404, never index.html served as JavaScript.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
    }
}
