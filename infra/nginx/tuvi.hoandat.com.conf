# .65: /etc/nginx/conf.d/tuvi.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here -> the static web app
# from the current release, and /api/, /auth/, /healthz to the Node server on loopback :5290 of this host.
# The Cloudflare real-IP restore is global on this host, so $remote_addr is the visitor's IP; the server
# trusts X-Forwarded-For from loopback only.

server {
    listen 80;
    listen [::]:80;
    server_name tuvi.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuvi.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/tuvi.hoandat.com.access.log;
    error_log  /var/log/nginx/tuvi.hoandat.com.error.log;

    root /var/www/tuvi/current/apps/web/dist;
    # Saved charts are a few hundred bytes of JSON.
    client_max_body_size 16k;

    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Videos and their posters live outside the releases (uploaded once with `deploy.sh media`, too large for the
    # repo), so a release or a rollback never touches them. A file may be replaced under the same name, hence a day
    # of caching rather than immutable; a miss is a real 404. nginx serves byte ranges, which video seeking needs.
    location /media/ {
        alias /var/www/tuvi/media/;
        # Spelled out: browsers ignore a caption track not served as text/vtt, and a `types` block replaces the
        # whole map, so it lists every kind of file kept here.
        types {
            video/mp4  mp4;
            image/jpeg jpg;
            text/vtt   vtt;
        }
        # No `always` here: a 404 (file not uploaded yet) must not be cached for a day by browsers or Cloudflare.
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5290;
        proxy_set_header Host $host;
    }

    # Every non-API response carries these. nginx drops inherited add_header lines in a block that declares
    # its own, so /assets/ repeats the ones it needs. The API stays out: the server (helmet) sends its own.
    # Cloudflare Web Analytics is allowed in script-src/connect-src (the privacy page says so).
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html (also as the SPA fallback) and the other unhashed files are revalidated on every visit, so
        # a browser never keeps a page that points at chunks of a previous release. The web app also reloads
        # once if a lazy chunk is gone (apps/web/src/chart/chart-engine.ts).
        add_header Cache-Control "no-cache" always;

        # The yearly pages (/tu-vi-2027, /tu-vi-2027/tuoi-ty…) are prerendered at build time as <path>/index.html,
        # so crawlers get real HTML; every other path is the SPA.
        try_files $uri $uri/index.html /index.html;

        # Hashed build files: cached for a year; a miss is a real 404, never index.html served as JavaScript.
        # This block sets its own headers, so it repeats the ones that matter for scripts.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            try_files $uri =404;
        }
    }
}
