# Continuous deploy of tuvi.hoandat.com: after `ci` passes on a push to main,
# build the web app, the server bundle and the migrations, upload them as the
# restricted `tuvi-deploy` user to /var/www/tuvi/ci-incoming/<id> and switch
# through the one sudo command that user has (infra/activate-incoming.sh:
# release, `current`, restart, healthz + origin check, previous release back on
# failure). Building (which runs dependency code) happens in a job without the
# deploy key; the deploy job only downloads the artifact, uploads it and
# activates it. nginx, the unit and the root scripts change only through
# infra/deploy.sh setup.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        name: build release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "id=$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}" >>"$GITHUB_OUTPUT"
          pnpm build
          # The same three folders infra/deploy.sh ships: the server bundle needs only Node and the migrations.
          mkdir release
          tar cf - apps/web/dist apps/server/dist apps/server/drizzle | tar xf - -C release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address and SSH port are secrets so the public repository does not show them.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      TARGET: tuvi-deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/var/www/tuvi/ci-incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/tuvi-activate-incoming $RELEASE_ID"
      - name: smoke from outside
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://tuvi.hoandat.com/)"
          [ "$code" = 200 ] || { echo "https://tuvi.hoandat.com/ -> $code" >&2; exit 1; }
          health="$(curl -fsS https://tuvi.hoandat.com/healthz | tr -d '\r\n')"
          [ "$health" = ok ] || { echo "healthz answered '$health'" >&2; exit 1; }
          served="$(curl -fsS "https://tuvi.hoandat.com/RELEASE?v=$RELEASE_ID" | tr -d '\r\n')"
          [ "$served" = "$RELEASE_ID" ] || { echo "origin serves '$served', expected $RELEASE_ID" >&2; exit 1; }
      - if: always()
        run: rm -f ~/.ssh/deploy_key
